name: go-port-ci

on:
  push:
    branches:
      - main
      - 'feature/go_port'
    paths:
      - 'go_src/**'
  pull_request:
    paths:
      - 'go_src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go_src/go.sum

      - name: tidy
        run: go mod tidy -diff || (echo "go.mod / go.sum out of date" && go mod tidy && git diff && exit 1)

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        run: go build -trimpath -o bin/gop ./cmd/gop
